[package]
name = "unidroid-py"
version = "0.8.1"
edition = "2021"

[lib]
name = "unidroid"
crate-type = ["cdylib", "lib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
test-utils = ["pyo3/auto-initialize"]

[dependencies]
unidroid-core = { git = "https://github.com/toneharbor/unidroid", package = "unidroid" }
pyo3 = { version = "0.29.3" }