[package]
name = "unidroid-py"
version = "0.8.3"
edition = "2021"

[lib]
name = "unidroid"
crate-type = ["cdylib", "lib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
unidroid-core = { git = "https://github.com/toneharbor/unidroid", package = "unidroid", tag = "v0.8.3" }
pyo3 = { version = "0.29.3" }