name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.8.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cargo.toml version
        shell: bash
        run: |
          python3 -c "
          import re, sys
          version = sys.argv[1].lstrip('v')
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'^version = \".*?\"', 'version = \"' + version + '\"', content, flags=re.MULTILINE)
          content = re.sub(r'tag = \"v.*?\"', 'tag = \"v' + version + '\"', content)
          with open('Cargo.toml', 'w') as f:
              f.write(content)
          print('Patched version and tag to ' + version)
          " "${VERSION}"
      - name: Commit, tag, and push
        id: set-version
        shell: bash
        run: |
          version="${VERSION#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          tag="v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          if git diff --cached --quiet; then
            echo "No changes to commit, version already ${tag}"
          else
            git commit -m "chore: bump version to ${tag}"
          fi
          git tag -f "${tag}"
          git push origin HEAD:${{ github.ref }} --tags --force

  build-wheels:
    needs: bump
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - name: Remove Cargo.lock
        run: rm -f Cargo.lock
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  release:
    needs: [bump, build-wheels]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout source for archive
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List wheels
        run: ls -la dist/
      - name: Create source archive
        run: |
          version="${VERSION#v}"
          git archive --format=tar.gz --prefix="unidroid-v${version}/" -o "dist/unidroid-v${version}-source.tar.gz" HEAD
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${VERSION#v}"
          tag="v${version}"
          echo "Creating release for ${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, uploading assets"
            gh release upload "${tag}" dist/*
          else
            gh release create "${tag}" --generate-notes --title "${tag}" dist/*
          fi