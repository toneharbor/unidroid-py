name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  resolve-unidroid-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - name: Get latest unidroid release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh api repos/zhoupb01/unidroid/releases/latest --jq '.tag_name')"
          if [[ -z "$tag" ]]; then
            echo "No unidroid release found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using unidroid tag: $tag"

  build-wheels:
    needs: resolve-unidroid-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      UNIDROID_TAG: ${{ needs.resolve-unidroid-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cargo.toml with latest unidroid release tag
        shell: bash
        run: |
          python3 -c "
          import re, sys
          tag = sys.argv[1].lstrip('v')
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          content = re.sub(
              r'unidroid-core = \{ git = \"https://github\.com/zhoupb01/unidroid\".*?\}',
              'unidroid-core = { git = \"https://github.com/zhoupb01/unidroid\", tag = \"' + tag + '\", package = \"unidroid\" }',
              content
          )
          with open('Cargo.toml', 'w') as f:
              f.write(content)
          print('Patched Cargo.toml:')
          for line in content.splitlines():
              if 'unidroid-core' in line:
                  print(line)
          " "${UNIDROID_TAG}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  release:
    needs: [resolve-unidroid-tag, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UNIDROID_TAG: ${{ needs.resolve-unidroid-tag.outputs.tag }}
        run: |
          echo "Built against unidroid ${UNIDROID_TAG}"
          gh release create "$GITHUB_REF_NAME" --generate-notes dist/*