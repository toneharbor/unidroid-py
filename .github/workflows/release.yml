name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-unidroid-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_REF_NAME#v}"
            echo "value=${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Get latest unidroid release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(gh api repos/toneharbor/unidroid/releases/latest --jq '.tag_name')"
          if [[ -z "$tag" ]]; then
            echo "No unidroid release found" >&2
            exit 1
          fi
          if [[ "$tag" != v* ]]; then
            tag="v${tag}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using unidroid tag: $tag"

  build-wheels:
    needs: resolve-unidroid-tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      UNIDROID_TAG: ${{ needs.resolve-unidroid-tag.outputs.tag }}
      VERSION: ${{ needs.resolve-unidroid-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cargo.toml with version and latest unidroid release tag
        shell: bash
        run: |
          python3 -c "
          import re, sys
          tag = sys.argv[1]
          version = sys.argv[2]
          with open('Cargo.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'^version = \".*?\"', 'version = \"' + version + '\"', content, flags=re.MULTILINE)
          content = re.sub(
              r'unidroid-core = \{ git = \"https://github\.com/toneharbor/unidroid\".*?\}',
              'unidroid-core = { git = \"https://github.com/toneharbor/unidroid\", tag = \"' + tag + '\", package = \"unidroid\" }',
              content
          )
          with open('Cargo.toml', 'w') as f:
              f.write(content)
          print('Patched Cargo.toml:')
          for line in content.splitlines():
              if 'unidroid-core' in line or line.startswith('version'):
                  print(line)
          " "${UNIDROID_TAG}" "${VERSION}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  release:
    needs: [resolve-unidroid-tag, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: List wheels
        run: ls -la dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          UNIDROID_TAG: ${{ needs.resolve-unidroid-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-unidroid-tag.outputs.version }}
        run: |
          echo "Built against unidroid ${UNIDROID_TAG}"
          tag="v${VERSION}"
          echo "Creating release for ${tag}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, uploading assets"
            gh release upload "${tag}" dist/*
          else
            gh release create "${tag}" --generate-notes --title "${tag}" dist/*
          fi